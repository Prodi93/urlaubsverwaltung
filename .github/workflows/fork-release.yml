name: Fork Release

# Release of the LI fork. Tag format: li-<version>, e.g. li-6.17.0-li.1
# The jar is attached to the GitHub release and fetched by the LXC update script.

on:
  push:
    tags:
      - 'li-*'

env:
  MAVEN_ARGS: "--no-transfer-progress --errors --fail-at-end --show-version"

permissions:
  contents: write

jobs:
  create-github-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: 'liberica'
          java-version-file: ".tool-versions"
          cache: 'maven'

      - name: Extract release version
        id: vars
        run: echo "version=${GITHUB_REF#refs/tags/li-}" >> $GITHUB_OUTPUT

      - name: Set project version
        run: ./mvnw versions:set -DnewVersion=${{ steps.vars.outputs.version }} -DgenerateBackupPoms=false

      # browser based ui tests are excluded like in the upstream build, they need playwright browsers
      - name: Build and test
        run: ./mvnw verify -Dgroups="!ui"

      - name: Create checksum
        run: |
          cd target
          sha256sum urlaubsverwaltung-${{ steps.vars.outputs.version }}.jar > urlaubsverwaltung-${{ steps.vars.outputs.version }}.jar.sha256

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ steps.vars.outputs.version }}
          generate_release_notes: true
          files: |
            ./target/urlaubsverwaltung-${{ steps.vars.outputs.version }}.jar
            ./target/urlaubsverwaltung-${{ steps.vars.outputs.version }}.jar.sha256
