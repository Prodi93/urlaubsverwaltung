<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title></title>
  </head>
  <body>
    <!-- one day of a person: presence, absence, public holiday or no workday, split into morning and noon if they differ -->
    <th:block th:fragment="day(day)">
      <span
        class="relative inline-flex items-center justify-center w-7 h-7 rounded-md overflow-hidden text-xs font-semibold align-middle"
        th:title="${@forkPresenceLabels.title(day)}"
        data-test-id="presence-day"
        th:attr="data-presence-kind=${day.split ? 'SPLIT' : day.morning.kind.name}"
      >
        <th:block th:if="${day.split}">
          <span
            class="absolute inset-y-0 left-0 w-1/2 border-r border-white dark:border-zinc-900"
            th:insert="~{fork/presence/fragments::half(half=${day.morning})}"
          ></span>
          <span
            class="absolute inset-y-0 right-0 w-1/2"
            th:insert="~{fork/presence/fragments::half(half=${day.noon})}"
          ></span>
        </th:block>
        <th:block th:unless="${day.split}">
          <span class="absolute inset-0" th:insert="~{fork/presence/fragments::half(half=${day.morning})}"></span>
          <span
            th:if="${day.morning.kind.name == 'PRESENCE'}"
            class="relative text-white"
            th:text="#{${'fork.presence.type.' + day.morning.type.name + '.short'}}"
            >B</span
          >
          <span
            th:if="${day.morning.kind.name == 'PUBLIC_HOLIDAY'}"
            class="relative text-zinc-700 dark:text-zinc-200"
            th:text="#{fork.presence.publicHoliday.short}"
            >F</span
          >
          <span th:if="${day.morning.kind.name == 'NO_WORKDAY'}" class="relative text-zinc-300 dark:text-zinc-600">
            <svg th:replace="~{icon/slash::svg(className='w-4 h-4')}" />
          </span>
        </th:block>
      </span>
    </th:block>

    <!-- background of a half day -->
    <span
      th:fragment="half(half)"
      class="block w-full h-full rounded-[inherit]"
      th:classappend="${half.kind.name == 'PRESENCE'
        ? (half.type.name == 'OFFICE' ? 'bg-sky-500' : (half.type.name == 'HOME_OFFICE' ? 'bg-emerald-500' : 'bg-violet-500')) + (half.explicit ? '' : ' opacity-50')
        : (half.kind.name == 'UNPLANNED' ? 'border border-dashed border-zinc-300 dark:border-zinc-600'
        : (half.kind.name == 'PUBLIC_HOLIDAY' ? 'bg-zinc-200 dark:bg-zinc-700' : ''))}"
      th:style="${half.kind.name == 'ABSENT'
        ? (half.absence.waiting ? 'box-shadow: inset 0 0 0 2px ' + half.absence.color : 'background-color: ' + half.absence.color)
        : null}"
    ></span>

    <th:block th:fragment="legend">
      <ul class="flex flex-wrap gap-x-6 gap-y-2 text-sm mt-6" data-test-id="presence-legend">
        <li class="flex items-center gap-2">
          <span
            class="inline-flex items-center justify-center w-6 h-6 rounded-md bg-sky-500 text-white text-xs font-semibold"
            th:text="#{fork.presence.type.OFFICE.short}"
            >B</span
          >
          <span th:text="#{fork.presence.type.OFFICE}">Büro</span>
        </li>
        <li class="flex items-center gap-2">
          <span
            class="inline-flex items-center justify-center w-6 h-6 rounded-md bg-emerald-500 text-white text-xs font-semibold"
            th:text="#{fork.presence.type.HOME_OFFICE.short}"
            >H</span
          >
          <span th:text="#{fork.presence.type.HOME_OFFICE}">Homeoffice</span>
        </li>
        <li class="flex items-center gap-2">
          <span
            class="inline-flex items-center justify-center w-6 h-6 rounded-md bg-violet-500 text-white text-xs font-semibold"
            th:text="#{fork.presence.type.MOBILE_WORK.short}"
            >M</span
          >
          <span th:text="#{fork.presence.type.MOBILE_WORK}">Mobil / unterwegs</span>
        </li>
        <li class="flex items-center gap-2">
          <span class="inline-block w-6 h-6 rounded-md bg-sky-500 opacity-50"></span>
          <span th:text="#{fork.presence.pattern.legend}">aus Wochenmuster</span>
        </li>
        <li class="flex items-center gap-2">
          <span class="relative inline-block w-6 h-6 rounded-md overflow-hidden">
            <span class="absolute inset-y-0 left-0 w-1/2 bg-sky-500 border-r border-white dark:border-zinc-900"></span>
            <span class="absolute inset-y-0 right-0 w-1/2 bg-emerald-500"></span>
          </span>
          <span th:text="#{fork.presence.legend.split}">Vormittag / Nachmittag</span>
        </li>
        <li class="flex items-center gap-2">
          <span
            class="inline-block w-6 h-6 rounded-md"
            style="box-shadow: inset 0 0 0 2px var(--absence-color-YELLOW)"
          ></span>
          <span th:text="#{fork.presence.waiting}">beantragt</span>
        </li>
        <li class="flex items-center gap-2">
          <span
            class="inline-flex items-center justify-center w-6 h-6 rounded-md bg-zinc-200 text-zinc-700 text-xs"
            th:text="#{fork.presence.publicHoliday.short}"
            >F</span
          >
          <span th:text="#{fork.presence.publicHoliday}">Feiertag</span>
        </li>
      </ul>
      <ul
        th:if="${vacationTypes != null}"
        class="flex flex-wrap gap-x-6 gap-y-2 text-sm mt-3"
        data-test-id="presence-legend-absences"
      >
        <li th:each="vacationType : ${vacationTypes}" class="flex items-center gap-2">
          <span
            class="inline-block w-6 h-6 rounded-md"
            th:style="|background-color: var(--absence-color-${vacationType.color.name})|"
          ></span>
          <span th:text="${vacationType.getLabel(#locale)}">Erholungsurlaub</span>
        </li>
        <li class="flex items-center gap-2">
          <span class="inline-block w-6 h-6 rounded-md" style="background-color: var(--sick-note-color)"></span>
          <span th:text="#{fork.presence.sick}">krank</span>
        </li>
      </ul>
    </th:block>

    <!-- month navigation, hrefPrefix must end with '?' or '&' -->
    <th:block th:fragment="month-navigation(hrefPrefix)">
      <div class="flex items-center gap-2">
        <a
          class="icon-link p-1"
          th:href="@{|${hrefPrefix}year=${previousMonth.year}&month=${previousMonth.monthValue}|}"
          th:title="#{fork.presence.month.previous}"
        >
          <svg th:replace="~{icon/chevron-left::svg(className='w-5 h-5')}" />
          <span class="sr-only" th:text="#{fork.presence.month.previous}"></span>
        </a>
        <span class="font-medium min-w-36 text-center" th:text="${monthName}">Oktober 2026</span>
        <a
          class="icon-link p-1"
          th:href="@{|${hrefPrefix}year=${nextMonth.year}&month=${nextMonth.monthValue}|}"
          th:title="#{fork.presence.month.next}"
        >
          <svg th:replace="~{icon/chevron-right::svg(className='w-5 h-5')}" />
          <span class="sr-only" th:text="#{fork.presence.month.next}"></span>
        </a>
      </div>
    </th:block>
  </body>
</html>
