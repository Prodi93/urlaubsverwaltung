<!doctype html>
<html
  lang="en"
  th:lang="${language}"
  th:class="|theme-${theme}|"
  th:data-nav-collapsed="${navigationCollapsed ? 'true' : null}"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:asset="http://www.w3.org/1999/xhtml"
>
  <head th:replace="~{_layout::head(title=~{::title}, scriptsDefer=~{::scriptsDefer}, preload=~{::preload})}">
    <title th:replace="~{fragments/page-title::page-title(#{fork.presence.today.title})}"></title>
    <th:block th:fragment="preload">
      <link rel="preload" th:replace="~{fragments/asset-dependency-preload::links('fork_presence.js')}" />
    </th:block>
    <th:block th:fragment="scriptsDefer">
      <script defer type="module" asset:src="fork_presence.js"></script>
    </th:block>
  </head>
  <body th:replace="~{_layout::body(content=~{::main})}">
    <main th:fragment="main" class="content-container content--max-w">
      <div th:if="${presenceSaved}" class="mb-4">
        <div th:replace="~{fragments/feedback-box::feedback-box-success(body=#{fork.presence.saved})}"></div>
      </div>

      <div th:replace="~{fragments/section-heading::section-heading(~{::today-heading-body}, ~{::today-heading-actions})}">
        <th:block th:ref="today-heading-body">
          <h1 th:text="#{fork.presence.today.title}">Meine Anwesenheit</h1>
        </th:block>
        <th:block th:ref="today-heading-actions">
          <a class="icon-link" th:href="@{/web/presence}" th:text="#{fork.presence.overview.link}">Teamübersicht</a>
        </th:block>
      </div>

      <ul class="space-y-4" data-test-id="presence-today">
        <li th:each="planningDay : ${days}" class="rounded-lg border border-zinc-200 dark:border-zinc-700 p-4">
          <div class="flex items-center justify-between gap-4 mb-3">
            <span class="font-medium">
              <th:block th:if="${planningDay.today}" th:text="#{fork.presence.today}">Heute</th:block>
              <th:block th:unless="${planningDay.today}" th:text="${planningDay.dayOfWeek}">Di</th:block>
              <span class="text-black/75 dark:text-zinc-300 font-normal" th:text="${#temporals.format(planningDay.date, 'dd.MM.yyyy')}">16.10.2026</span>
            </span>
            <th:block th:replace="~{fork/presence/fragments::day(day=${planningDay.day})}"></th:block>
          </div>
          <form th:if="${planningDay.day.workday}" method="post" th:action="@{/web/presence/today}" class="grid grid-cols-3 gap-2">
            <input type="hidden" name="date" th:value="${planningDay.date}" />
            <button
              th:each="presenceType : ${presenceTypes}"
              type="submit"
              name="type"
              th:value="${presenceType.name}"
              class="button py-3"
              th:classappend="${planningDay.day.kind.name == 'PRESENCE' && planningDay.day.type == presenceType ? 'button-main-green' : ''}"
              th:text="#{${'fork.presence.type.' + presenceType.name}}"
            >Büro</button>
          </form>
          <p th:unless="${planningDay.day.workday}" class="text-sm text-black/75 dark:text-zinc-300" th:text="#{fork.presence.today.noWorkday}"></p>
        </li>
      </ul>

      <p class="mt-6">
        <a class="icon-link" th:href="@{/web/presence/persons/{id} (id=${person.id})}" th:text="#{fork.presence.planning.link}">Ganzen Monat planen</a>
      </p>
    </main>
  </body>
</html>
