fork.csv.import.description=Personen werden über den Benutzernamen (username) oder die E-Mail-Adresse erkannt. Die Datei wird zuerst geprüft, gespeichert wird erst nach Bestätigung. Importierte Abwesenheiten werden ohne Genehmigungsablauf gespeichert, es werden keine E-Mails versendet. Vorlagen mit allen Spalten:
fork.csv.import.help.APPLICATIONS=Pflicht: vacation_type (Bezeichnung), start_date, end_date. Optional: day_length (FULL, MORNING, NOON), status (ALLOWED, WAITING, CANCELLED, REJECTED; Standard ALLOWED), hours (bei Überstundenabbau), reason. Bestehende Abwesenheiten werden nicht verändert.
fork.csv.import.help.ACCOUNTS=Pflicht: year, annual_vacation_days, actual_vacation_days, remaining_vacation_days. Vorhandene Konten werden aktualisiert.
fork.csv.import.help.PRESENCES=Pflicht: date, type (OFFICE, HOME_OFFICE, MOBILE_WORK). Ein leerer type entfernt die geplante Anwesenheit.
fork.csv.import.help.PERSONS_WORKING_TIMES=Pflicht: valid_from, working_days (z. B. MON,TUE,WED,THU,FRI). Unbekannte Personen werden angelegt (username, email, first_name, last_name nötig; das Office erhält dafür die übliche E-Mail). part_time_percentage setzt die Teilzeit ab valid_from, departments wird nur exportiert.
