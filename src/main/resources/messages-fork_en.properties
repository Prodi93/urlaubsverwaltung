fork.csv.import.help.APPLICATIONS=Required: vacation_type (label), start_date, end_date. Optional: day_length (FULL, MORNING, NOON), status (ALLOWED, WAITING, CANCELLED, REJECTED; default ALLOWED), hours (for overtime reduction), reason. Existing absences are not changed.
fork.csv.import.help.ACCOUNTS=Required: year, annual_vacation_days, actual_vacation_days, remaining_vacation_days. Existing accounts are updated.
fork.csv.import.help.PRESENCES=Required: date, type (OFFICE, HOME_OFFICE, MOBILE_WORK). An empty type removes the planned presence.
fork.csv.import.help.PERSONS_WORKING_TIMES=Required: valid_from, working_days (e.g. MON,TUE,WED,THU,FRI). Unknown persons are created (username, email, first_name, last_name required; the office gets the usual email). part_time_percentage sets the part time from valid_from, departments is only exported.
