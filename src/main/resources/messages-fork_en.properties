fork.teams.settings.title=Microsoft Teams
fork.teams.settings.description=The application can be added as app to Microsoft Teams: in the app bar (team calendar, my presence, overview, my tasks) and as tab in channels and chats. Users sign in once with a Microsoft sign in window.
fork.teams.settings.disabled=The Teams integration is not enabled yet. Please add to the application.yaml and restart the application:
fork.teams.settings.steps=Setup
fork.teams.settings.step1=Enable the integration (uv.fork.teams.enabled: true in the application.yaml, then restart).
fork.teams.settings.step2=Download the app package:
fork.teams.settings.step3=Teams admin center → Teams apps → Manage apps → "Upload new app" and select the ZIP. For an update open the existing app there and choose "Upload file".
fork.teams.settings.step4=Optional: Teams apps → Setup policies → Global → add the app to "Pinned apps", so it appears in the app bar of everyone.
fork.teams.settings.step5=In a channel: "+" (add a tab) → select the app → choose a page, e.g. the team calendar.
fork.teams.settings.url=Address
fork.teams.settings.appId=App ID
fork.teams.settings.update=After an update of the application the app version of the package is higher. Uploading it again is only needed if tabs or texts of the app should change.
fork.teams.tab.unknownPerson=You are not known to the application yet. Please sign in once in the browser, then the sign in in Teams works automatically.
fork.teams.settings.sso.title=Single sign on (Teams SSO)
fork.teams.settings.sso.description=With Teams SSO, Teams signs in the users automatically without a sign in window. This is needed on devices with Intune app protection policies (e.g. BYOD), the sign in window is blocked there. Once in Entra ID → App registrations → the app registration of the application:
fork.teams.settings.sso.unavailable=Teams SSO is only possible with the sign in via Microsoft Entra ID (issuer-uri https://login.microsoftonline.com/<tenant>/v2.0 and client id of the app registration).
fork.teams.settings.sso.step1="Expose an API" → set the application ID URI to:
fork.teams.settings.sso.step2="Add a scope": name access_as_user, who can consent "Admins and users", any display texts, state enabled.
fork.teams.settings.sso.step3="Add a client application" for both IDs (Teams desktop/mobile and Teams web) with the scope access_as_user:
fork.teams.settings.sso.step4=Optional: "API permissions" → add a permission → tab "APIs my organization uses" → search the app registration → access_as_user, then "Grant admin consent". Not needed, the Teams clients may access without consent as "Authorized client applications". ("My APIs" only lists apps you own.)
fork.teams.settings.sso.step5=Download the app package again and upload it to the existing app in the Teams admin center ("Upload file"), it contains the settings for SSO now.
fork.teams.settings.sso.clientId=Client ID of the app registration
