<!doctype html>
<html lang="__LANG__">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fafafa" />
    <title>__TITLE__</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --fg: #27272a;
        --muted: #52525b;
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #18181b;
          --fg: #e4e4e7;
          --muted: #a1a1aa;
          --accent: #60a5fa;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      main {
        max-width: 28rem;
        padding: 2rem 1.5rem;
        text-align: center;
      }
      img {
        width: 4rem;
        height: 4rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 1.5rem 0 0.75rem;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 2rem;
      }
      button {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.75rem 1.5rem;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="__ICON__" alt="" />
      <h1>__HEADLINE__</h1>
      <p>__TEXT__</p>
      <button type="button" onclick="window.location.reload()">__RETRY__</button>
    </main>
  </body>
</html>
